name: 🚀 四端自动构建

on:
  workflow_dispatch: # 手动触发，可选择平台
    inputs:
      platform:
        description: '选择要构建的平台'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - mac
          - windows
  push:
    branches:
      - main
    paths:
      - 'desktop-apps/**'
      - '.github/workflows/build-all-platforms.yml'

jobs:
  # ===== Android 构建 =====
  build-android:
    name: 📱 构建 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 构建 Android APK
        working-directory: desktop-apps/android-twa
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: SiteHub-Android
          path: desktop-apps/android-twa/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # ===== Mac 构建 =====
  build-mac:
    name: 🍎 构建 Mac DMG
    runs-on: macos-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli

      - name: 构建 Mac 应用
        working-directory: desktop-apps/mac-tauri
        run: cargo tauri build

      - name: 上传 DMG
        uses: actions/upload-artifact@v4
        with:
          name: SiteHub-Mac
          path: desktop-apps/mac-tauri/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

  # ===== iOS 构建 (需要证书,暂时跳过自动构建) =====
  # build-ios:
  #   name: 📱 构建 iOS IPA
  #   runs-on: macos-latest
  #   # iOS需要Apple开发者证书,建议手动构建
  #   if: false

  # ===== Windows 构建 =====
  build-windows:
    name: 🪟 构建 Windows MSI
    runs-on: windows-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: 安装 Tauri CLI
        run: cargo install tauri-cli

      - name: 构建 Windows 应用
        working-directory: desktop-apps/windows-tauri
        run: cargo tauri build

      - name: 上传 MSI
        uses: actions/upload-artifact@v4
        with:
          name: SiteHub-Windows
          path: desktop-apps/windows-tauri/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

  # ===== 汇总所有构建产物 =====
  package-all:
    name: 📦 打包所有安装包
    needs: [build-android, build-mac, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-packages

      - name: 创建发布包
        run: |
          cd release-packages
          ls -R

      - name: 上传完整发布包
        uses: actions/upload-artifact@v4
        with:
          name: SiteHub-AllPlatforms-Release
          path: release-packages/
          retention-days: 30

      - name: 生成构建报告
        run: |
          echo "# 🎉 四端构建完成" > build-report.md
          echo "" >> build-report.md
          echo "## 📦 已生成的安装包:" >> build-report.md
          echo "" >> build-report.md
          echo "- ✅ Android APK" >> build-report.md
          echo "- ✅ Mac DMG" >> build-report.md
          echo "- ✅ Windows MSI" >> build-report.md
          echo "- ⏳ iOS IPA (需要手动构建)" >> build-report.md
          echo "" >> build-report.md
          echo "## 📥 下载方式:" >> build-report.md
          echo "1. 进入 GitHub Actions 页面" >> build-report.md
          echo "2. 点击本次运行记录" >> build-report.md
          echo "3. 在 Artifacts 区域下载 **SiteHub-AllPlatforms-Release.zip**" >> build-report.md
          cat build-report.md

      - name: 上传构建报告
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.md
          retention-days: 30
